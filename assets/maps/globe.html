<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#071725;color:#d9efef;font:14px system-ui,sans-serif}
.earth{position:relative;background:radial-gradient(ellipse at 50% 45%,#183747 0,#091d2c 50%,#071725 76%);border:1px solid #294351;border-radius:24px;overflow:hidden}
canvas{width:100%;height:430px;display:block;touch-action:none;cursor:grab;outline-offset:-5px}canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #71e4cc}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px 12px}
button,a{font:inherit;color:#d9efef;border:1px solid #48616e;border-radius:20px;background:#152f3d;padding:8px 14px;cursor:pointer;text-decoration:none}
button:hover,a:hover{background:#264b5c}button:focus-visible,a:focus-visible{outline:2px solid #71e4cc;outline-offset:2px}
.hint{text-align:center;color:#b1c8d4;font-size:12px;margin:0 0 14px}.badge{position:absolute;top:16px;left:18px;color:#70dcc4;font-size:11px;letter-spacing:2px;pointer-events:none}
@media(max-width:500px){canvas{height:340px}}
</style></head><body><div class="earth"><span class="badge">EARTH / EXPLORE</span>
<canvas id="earth" tabindex="0" role="img" aria-label="Interactive rotating Earth. Drag or use arrow keys to rotate. Use the buttons to zoom, pause or explore Bangladesh."></canvas>
<div class="controls"><button id="motion">Pause rotation</button><button id="focus">Focus Bangladesh</button><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><a href="?view=explore" target="_top">Open Bangladesh →</a></div>
<p class="hint">Drag to rotate · Scroll to zoom · Click the Bangladesh pin · Natural Earth outlines</p></div>
<script>__D3_ARRAY__</script><script>__D3_GEO__</script><script>
const land=__LAND__, bangladesh=__BANGLADESH__;
// D3's spherical polygon convention uses clockwise exterior rings.
function orient(feature){let g=feature.geometry;let polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(let p of polys){if(d3.geoArea({type:'Polygon',coordinates:p})>2*Math.PI)p.forEach(r=>r.reverse());}return feature;}
land.features.forEach(orient);orient(bangladesh);
const canvas=document.getElementById('earth'), ctx=canvas.getContext('2d');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let running=!reduced.matches, dragging=false, moved=false, start=null, zoom=1, width=600,height=430,last=0,pin=null;
let rotation=[-90,-20,0];
const projection=d3.geoOrthographic().clipAngle(90).precision(.4), path=d3.geoPath(projection,ctx), graticule=d3.geoGraticule10();
function motionLabel(){document.getElementById('motion').textContent=running?'Pause rotation':'Resume rotation';document.getElementById('motion').setAttribute('aria-pressed',String(running));}
function size(){width=canvas.clientWidth;height=canvas.clientHeight;let ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);draw();}
function draw(){
 ctx.clearRect(0,0,width,height);let radius=Math.min(width*.43,height*.43)*zoom;
 projection.translate([width/2,height/2]).scale(radius).rotate(rotation);
 // Decorative stars, deterministic and independent of scientific data.
 ctx.fillStyle='#517187';for(let i=0;i<45;i++){let x=(i*113+17)%width,y=(i*71+43)%height;ctx.globalAlpha=.25+(i%3)*.15;ctx.fillRect(x,y,1.5,1.5);}ctx.globalAlpha=1;
 ctx.shadowColor='#65d9c1';ctx.shadowBlur=24;ctx.beginPath();path({type:'Sphere'});ctx.fillStyle='#102f43';ctx.fill();ctx.shadowBlur=0;
 ctx.save();ctx.beginPath();path({type:'Sphere'});ctx.clip();
 ctx.beginPath();path(graticule);ctx.lineWidth=.6;ctx.strokeStyle='#315264';ctx.stroke();
 ctx.beginPath();path(land);ctx.fillStyle='#3a7e80';ctx.fill();ctx.strokeStyle='#69aaa4';ctx.lineWidth=.5;ctx.stroke();
 ctx.beginPath();path(bangladesh);ctx.fillStyle='#9cf0cb';ctx.fill();
 let shade=ctx.createLinearGradient(width/2-radius,0,width/2+radius,0);shade.addColorStop(0,'rgba(0,5,15,.45)');shade.addColorStop(.45,'rgba(0,5,15,0)');shade.addColorStop(1,'rgba(0,5,15,.56)');ctx.fillStyle=shade;ctx.fillRect(0,0,width,height);ctx.restore();
 ctx.beginPath();path({type:'Sphere'});ctx.strokeStyle='#638d98';ctx.lineWidth=1;ctx.stroke();
 const centre=projection.invert([width/2,height/2]);pin=null;
 if(d3.geoDistance(centre,[90.35,23.7])<Math.PI/2){pin=projection([90.35,23.7]);ctx.beginPath();ctx.arc(pin[0],pin[1],9,0,Math.PI*2);ctx.fillStyle='#071725';ctx.fill();ctx.beginPath();ctx.arc(pin[0],pin[1],5,0,Math.PI*2);ctx.fillStyle='#9cf0cb';ctx.fill();ctx.fillStyle='#e9fffa';ctx.font='600 13px system-ui';ctx.fillText('Bangladesh',pin[0]+14,pin[1]+4);}
}
function tick(t){if(running&&!dragging&&!document.hidden){rotation[0]+=Math.min(t-last,40)*.003;draw();}last=t;requestAnimationFrame(tick);}
function stop(){running=false;motionLabel();}
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=false;stop();start={x:e.clientX,y:e.clientY,rotation:[...rotation]};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;rotation=[start.rotation[0]+dx*.32,Math.max(-80,Math.min(80,start.rotation[1]-dy*.32)),0];draw();});
canvas.addEventListener('pointerup',e=>{dragging=false;if(!moved&&pin){let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-pin[0],y-pin[1])<28)window.open('?view=explore','_top');}});
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.7,Math.min(1.8,zoom-e.deltaY*.001));draw();},{passive:false});
canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();stop();rotation[0]+=e.key==='ArrowLeft'?-8:e.key==='ArrowRight'?8:0;rotation[1]=Math.max(-80,Math.min(80,rotation[1]+(e.key==='ArrowUp'?8:e.key==='ArrowDown'?-8:0)));draw();}});
document.getElementById('motion').onclick=()=>{running=!running;motionLabel();};
document.getElementById('focus').onclick=()=>{stop();rotation=[-90.35,-23.7,0];zoom=1;draw();};
document.getElementById('plus').onclick=()=>{zoom=Math.min(1.8,zoom+.15);draw();};document.getElementById('minus').onclick=()=>{zoom=Math.max(.7,zoom-.15);draw();};
reduced.addEventListener('change',e=>{if(e.matches)stop();});new ResizeObserver(size).observe(canvas);motionLabel();size();requestAnimationFrame(tick);
</script></body></html>
